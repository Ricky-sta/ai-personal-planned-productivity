<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fbcfe8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4c0519" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Star Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="url(#starGlow)" />

  <!-- Sparkling anime stars in background -->
  <g fill="#ffffff" opacity="0.85">
    <polygon points="120,110 125,125 140,130 125,135 120,150 115,135 100,130 115,125" />
    <polygon points="390,130 394,142 406,146 394,150 390,162 386,150 374,146 386,142" />
    <polygon points="110,380 113,390 123,393 113,396 110,406 107,396 97,393 107,390" />
    <polygon points="400,370 405,385 420,390 405,395 400,410 395,395 380,390 395,385" />
    <circle cx="160" cy="210" r="4" />
    <circle cx="360" cy="220" r="5" />
  </g>

  <!-- Central Star Shield / Anime Companion Core Symbol -->
  <g filter="url(#softShadow)">
    <!-- Big 4-point star -->
    <path d="M256,70 Q256,256 70,256 Q256,256 256,442 Q256,256 442,256 Q256,256 256,70 Z" fill="#ffffff" />
    <!-- Diagonal smaller star -->
    <path d="M256,135 Q256,256 135,256 Q256,256 256,377 Q256,256 377,256 Q256,256 256,135 Z" fill="#fce7f3" opacity="0.9" />
  </g>

  <!-- Mascot Face Inside Star Core -->
  <g transform="translate(186, 196)">
    <!-- Cute anime smiling eyes -->
    <path d="M24,58 Q44,40 60,58" fill="none" stroke="#be185d" stroke-width="8" stroke-linecap="round" />
    <path d="M80,58 Q96,40 116,58" fill="none" stroke="#be185d" stroke-width="8" stroke-linecap="round" />
    <!-- Blushes -->
    <ellipse cx="28" cy="74" rx="14" ry="8" fill="#fda4af" opacity="0.9" />
    <ellipse cx="112" cy="74" rx="14" ry="8" fill="#fda4af" opacity="0.9" />
    <!-- Happy open smile -->
    <path d="M58,74 Q70,92 82,74" fill="#f43f5e" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Crown Star -->
  <polygon points="256,120 264,136 282,138 268,150 272,168 256,158 240,168 244,150 230,138 248,136" fill="#fde047" stroke="#f59e0b" stroke-width="2" />
</svg>
